<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Python Girls That Code</title>
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
  <main class="profile-card">

    <section class="illustration-panel" aria-label="Girl coding illustration">
      <img
        src="/static/images/coding-girl.png"
        alt="A girl coding in a cozy workspace"
      >
    </section>

    <section class="form-panel">
      <div class="brand">
        <span class="brand-icon">🐍</span>
        <div>
          <h1>Python <em>Girls</em> That Code<span class="sparkle"> ✨</span></h1>
          <p class="subtitle">
            A little corner of the internet for girls who code. 💜
          </p>
        </div>
      </div>

      <form id="profile-form">
        <label for="name">Name</label>
        <input
          id="name"
          type="text"
          placeholder="Enter your name"
          required
        >

        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          placeholder="Enter your email"
          required
        >

        <label for="job_title">Job title</label>
        <input
          id="job_title"
          type="text"
          placeholder="e.g. DevOps Engineer"
        >

        <label for="bio">Bio</label>
        <textarea
          id="bio"
          rows="3"
          placeholder="Tell us a little about yourself..."
        ></textarea>

        <label for="skills">Skills</label>
        <input
          id="skills"
          type="text"
          placeholder="Python, Docker, FastAPI, MongoDB"
        >
        <p class="field-hint">Separate your skills with commas.</p>

        <button type="submit">♡ Save profile</button>
      </form>

      <p id="status" role="status" aria-live="polite"></p>

      <p class="footer-note">Made with Python, curiosity & a little magic ✨</p>
    </section>

  </main>

  <script>
    const fields = ["name", "email", "job_title", "bio", "skills"];
    const status = document.getElementById("status");

    async function loadProfile() {
      try {
        const response = await fetch("/get-profile");

        if (!response.ok) {
          if (response.status === 404) {
            status.textContent = "No profile yet. Create your first one! 💜";
            return;
          }
          throw new Error("Unable to load profile");
        }

        const profile = await response.json();

        fields.forEach(field => {
          document.getElementById(field).value = profile[field] ?? "";
        });

        status.textContent = "Profile loaded successfully 💜";
      } catch (error) {
        status.textContent = error.message;
      }
    }

    document.getElementById("profile-form").addEventListener(
      "submit",
      async event => {
        event.preventDefault();
        status.textContent = "Saving your profile...";

        const profile = Object.fromEntries(
          fields.map(field => [
            field,
            document.getElementById(field).value
          ])
        );

        try {
          const response = await fetch("/update-profile", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify(profile)
          });

          if (!response.ok) {
            throw new Error("Unable to save profile");
          }

          const result = await response.json();
          status.textContent = result.message ?? "Profile saved! 💜";
        } catch (error) {
          status.textContent = error.message;
        }
      }
    );

    loadProfile();
  </script>
</body>
</html>
